services:
  - type: web
    name: iris-ml-production-api
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: MODEL_PATH
        value: models/model.pkl
      - key: SCALER_PATH
        value: models/scaler.pkl
